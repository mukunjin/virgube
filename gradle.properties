# 指定 Android Studio 自带的 JDK，免去每次在命令行设置 JAVA_HOME
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Compose 编译较吃内存：过小的堆会频繁 GC 导致构建极慢
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m

org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：二次构建显著提速
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- 版本号唯一来源 ----
# 改版本只改这里：app/build.gradle.kts 会读取并写入 APK；
# 界面如需显示版本，读 BuildConfig.VERSION_NAME 即可与 APK 完全一致。
# versionName 是自由字符串（可写 1.0.0）；versionCode 必须是递增整数。
virgube.versionName=0.2.0
virgube.versionCode=3